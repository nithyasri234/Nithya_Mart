<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NithyaMart - Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- Header -->

    <div class="header-bar">
        NITHYA MART
    </div>


    <!-- Login Container -->

    <div class="login-container">

        <h2>Login</h2>


        <form id="loginForm"
              action="login"
              method="POST">


            <!-- Email -->

            <div class="form-row">

                <label for="email">
                    Email:
                </label>

                <div class="input-field">

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>

            </div>


            <!-- Password -->

            <div class="form-row">

                <label for="password">
                    Password:
                </label>

                <div class="input-field password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                </div>

            </div>


            <!-- Show Password -->

            <div class="status-container">

                <label class="checkbox-label">

                    <input
                        type="checkbox"
                        id="showLoginPassword">

                    Show password

                </label>

            </div>


            <!-- Error Message -->

            <div
                id="loginError"
                class="error-message"
                style="display: none;">
            </div>


            <!-- Buttons -->

            <div class="button-row">

                <button
                    type="submit"
                    class="btn btn-submit">

                    Login

                </button>


                <button
                    type="reset"
                    class="btn btn-reset">

                    Reset

                </button>

            </div>


            <!-- Signup Link -->

            <div class="footer-text">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </div>

        </form>

    </div>


    <!-- Login JavaScript -->

    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const loginForm =
                document.getElementById("loginForm");

            const loginError =
                document.getElementById("loginError");

            const passwordInput =
                document.getElementById("password");

            const showPassword =
                document.getElementById("showLoginPassword");


            /*
             * Show / Hide Password
             */

            showPassword.addEventListener("change", () => {

                if (showPassword.checked) {

                    passwordInput.type = "text";

                } else {

                    passwordInput.type = "password";

                }

            });


            /*
             * Login Form Submission
             */

            loginForm.addEventListener(
                "submit",
                async (event) => {

                    event.preventDefault();


                    /*
                     * Clear previous error
                     */

                    loginError.style.display = "none";

                    loginError.textContent = "";


                    /*
                     * Read form values
                     */

                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();

                    const password =
                        passwordInput.value;


                    /*
                     * Validate email
                     */

                    if (email === "") {

                        showError(
                            "Please enter your email."
                        );

                        return;
                    }


                    /*
                     * Validate password
                     */

                    if (password === "") {

                        showError(
                            "Please enter your password."
                        );

                        return;
                    }


                    /*
                     * Disable login button
                     * while request is running
                     */

                    const submitButton =
                        loginForm.querySelector(
                            ".btn-submit"
                        );

                    submitButton.disabled = true;

                    submitButton.textContent =
                        "Logging in...";


                    try {

                        /*
                         * Prepare form data
                         */

                        const formData =
                            new URLSearchParams();

                        formData.append(
                            "email",
                            email
                        );

                        formData.append(
                            "password",
                            password
                        );


                        /*
                         * Send request to LoginServlet
                         */

                        const response =
                            await fetch(
                                "login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/x-www-form-urlencoded"
                                    },

                                    body: formData
                                }
                            );


                        /*
                         * Login successful
                         */

                        if (response.ok) {

                            window.location.href =
                                "index.html";

                            return;
                        }


                        /*
                         * Invalid credentials
                         */

                        if (response.status === 401) {

                            showError(
                                "Invalid email or password."
                            );

                            return;
                        }


                        /*
                         * Validation error
                         */

                        if (response.status === 400) {

                            showError(
                                "Please enter valid login details."
                            );

                            return;
                        }


                        /*
                         * Other server error
                         */

                        showError(
                            "Login failed. Please try again."
                        );

                    } catch (error) {

                        console.error(
                            "Login error:",
                            error
                        );

                        showError(
                            "Unable to connect to the server. Please try again."
                        );

                    } finally {

                        /*
                         * Enable button again
                         */

                        submitButton.disabled = false;

                        submitButton.textContent =
                            "Login";

                    }

                }
            );


            /*
             * Display error message
             */

            function showError(message) {

                loginError.textContent =
                    message;

                loginError.style.display =
                    "block";

            }

        });

    </script>

</body>

</html>
