<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h2>NITHYA MART</h2>
  <center>
<form class="form">
    <table>
         <h1>Login</h1>
         <tr>
          <td>UserName:</td> <td><input type="text" placeholder="Enter your Name"></td>
         </tr>
         <tr>
          <td>Email:</td> <td><input type="email" placeholder="Enter your email"></td>
         </tr>
         <tr>
          <td>Password:</td> <td><input type="password" placeholder="Enter your password" id="myInput"></td> <td>
            <input type="checkbox" onclick="myFunction()" >Show Password
        </td>
          <br><br>
        </tr>
        <tr>
          <td>Confirm Password:</td> <td><input type="Confirm password" placeholder="re-write your password" id="myInputuser" ></td>
         <td>
            <input type="checkbox" onclick="myFunction()">Show Password
        </td>
        <tr>
            <td><span id="errorMessage" style="color: red; display: none;"></span></td>
        </tr>
        </tr>
        <tr>
          <td>Role:</td> 
          <td>
            <select aria-placeholder="select your role">

              <option>
                Buyer
              </option>
              <option>Seller</option>
            </select>
          </td>
        </tr>
        <tr>
          <td><input type="submit" class="button"></td> <td><input type="reset" class="button1"></td>
        </tr>
        
    </table>
    
</form>
</center>
<script src="js/app.js"></script>
<script src="js/togglePassword.js"></script>
</body>
