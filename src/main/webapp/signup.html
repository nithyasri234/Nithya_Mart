<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header-bar">
        NITHYA MART
    </div>

    <div class="login-container">
        <h2>Login</h2>
        <form id="registrationForm" action="register" method="POST" onsubmit="return validateForm()">
             <div class="form-row">
                <label for="username">UserName:</label>
                <div class="input-field">
                    <input type="text" id="username" name="username" placeholder="Enter your Name" required>
                </div>
            </div>
            <div class="form-row">
                <label for="email">Email:</label>
                <div class="input-field">
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="form-row">
                <label for="password">Password:</label>
                <div class="input-field">
                    <input type="password" id="password" name="password" required>
                </div>
            </div>
            <div class="action-row">
            <div class="checkbox-container">
                    <input type="checkbox" id="showPassword">
                    <label for="showPassword">Show Password</label>
            </div>
        </div>
            <div class="form-row">
                <label for="confirmPassword">Confirm Password:</label>
                <div class="input-field">
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>
            </div>
             <div class="action-row">
                <!-- JavaScript handles when to show this error element -->
                <div id="errorMsg" class="error-message">Passwords do not match!</div>
                
                <div class="checkbox-container">
                    <input type="checkbox" id="showConfirmPassword">
                    <label for="showConfirmPassword">Show Confirm Password</label>
                </div>
            </div>

            <div class="form-row">
                <label for="role">Role:</label>
                <div class="input-field">
                    <select id="role" name="role">
                        <option value="Buyer">Buyer</option>
                        <option value="Seller">Seller</option>
                    </select>
                </div>
            </div>

            <div class="button-row">
                <button type="submit" class="btn btn-submit">Submit</button>
                <button type="reset" class="btn btn-reset" onclick="hideError()">Reset</button>
            </div>

            <div class="footer-text">
                Already have an account?
            </div>
            </form>
    </div>
<script src="js/app.js"></script>
<script src="js/togglePassword.js"></script>
</body>
