<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header-bar">
        NITHYA MART
    </div>

    <div class="login-container">
        <h2>Login</h2>
        <form id="registrationForm" action="register" method="POST" onsubmit="return validateForm()">
             <div class="form-row">
                <label for="username">UserName:</label>
                <div class="input-field">
                    <input type="text" id="username" name="username" placeholder="Enter your Name" required>
                </div>
            </div>
            <div class="form-row">
                <label for="email">Email:</label>
                <div class="input-field">
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
            </div>

            <!-- Password Field Container Row -->
<div class="form-row">
    <label for="password">Password:</label>
    <div class="input-field password-wrapper">
        <input type="password" id="password">

    <!-- This MUST be inside the form-row div to stay docked near the input -->
    <div class="requirements-box">
        <div class="requirement-item" id="req-length">Must be between 6-12 characters</div>
        <div class="requirement-item" id="req-case-upper">Use upper case letters</div>
        <div class="requirement-item" id="req-case-lower">Use lower case letters</div>
        <div class="requirement-item" id="req-number">use a numbers 0-9</div>
        <div class="requirement-item" id="req-symbol">use a symbol</div>
    </div>
    </div>
</div>

            
            <div class="form-row">
                <label for="confirmPassword">Confirm Password:</label>
                <div class="input-field">
                    <input type="password" id="confirmPassword" autocomplete="new-password">
                </div>
            </div>

            <div class="status-container">
                <label class="checkbox-label">
                    <input type="checkbox" id="showPassword"> Show password
                </label>
                <div class="match-indicator" id="matchIndicator">Match</div>
            </div>


            <div class="form-row">
                <label for="role">Role:</label>
                <div class="input-field">
                    <select id="role" name="role">
                        <option value="Buyer">Buyer</option>
                        <option value="Seller">Seller</option>
                    </select>
                </div>
            </div>

            <div class="button-row">
                <button type="submit" class="btn btn-submit">Submit</button>
                <button type="reset" class="btn btn-reset" onclick="hideError()">Reset</button>
            </div>

            <div class="footer-text">
                Already have an account?
            </div>
            </form>
    </div>
<script src="js/app.js"></script>
<script src="js/togglePassword.js"></script>
</body>
